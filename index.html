<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Porra Doomsday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--cd:#fff;--tx:#14181d;--mu:#5d6773;--ok:#1f6b4f;--ko:#b3261e;--bd:#d5dbe1;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1316;--cd:#1a2025;--tx:#e8edf1;--mu:#8e99a4;--ok:#4cc38a;--ko:#ff6b60;--bd:#2c353d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:16px 14px 90px}
h1,.pts{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700}
h1{font-size:34px;margin:6px 0 0;letter-spacing:.02em}
.sub{color:var(--mu);margin:0 0 12px;font-size:14px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button,.s{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;font:inherit;font-size:14px}
.tabs button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
input[type=text],input[type=number]{width:100%;padding:12px;font:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx)}
select{width:100%;padding:12px;font:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx)}
#who{margin-bottom:8px}
.link{background:none;border:0;color:var(--mu);text-decoration:underline;font:inherit;font-size:14px;padding:10px 0;cursor:pointer}
h2{font-size:14px;color:var(--mu);margin:20px 0 6px;font-weight:600}
.chip{display:flex;justify-content:space-between;width:100%;padding:13px 14px;margin:0 0 5px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;font:inherit;text-align:left}
.chip.sel,.chip.d1{border-color:var(--ko);box-shadow:inset 4px 0 0 var(--ko)}
.chip.d2{opacity:.5;text-decoration:line-through}
.chip small{color:var(--mu)}
.bar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;font-size:14px;color:var(--mu);border-top:1px solid var(--bd)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin:0 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pts{font-size:30px}
.msg{padding:12px;border-left:4px solid var(--ok);background:var(--cd);margin:10px 0;font-size:14px}
.hide{display:none}
.s{flex:none;padding:8px 12px}
</style>
</head>
<body>
<main>
<h1>Porra Doomsday</h1>
<p class="sub">Marca quién crees que muere en Avengers: Doomsday.</p>
<div id="err" class="msg hide" style="border-color:var(--ko)"></div>
<div class="tabs"><button data-t="bet" class="on">Mi apuesta</button><button data-t="rank">Ranking</button></div>
<section id="bet">
  <div id="who" class="hide"><select id="whoSel" aria-label="Quién apuesta"></select></div>
  <input type="text" id="name" placeholder="Tu nombre" maxlength="24" autocomplete="off">
  <div id="claimBox" class="hide">
    <button class="link" id="claimLink" type="button">Ya aposté antes: elegir mi nombre de la lista</button>
    <div id="claimSel" class="hide"><select id="claimList"></select></div>
  </div>
  <div id="closed" class="msg hide">Apuestas cerradas.</div>
  <div id="list"></div>
  <div class="bar" id="count"></div>
</section>
<section id="rank" class="hide"></section>
<section id="adm" class="hide"></section>
<p style="text-align:center;margin-top:30px"><button class="s" id="admBtn">Admin</button></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://zmpmqllonbvxoervdyxd.supabase.co", SUPABASE_KEY="sb_publishable_Oq1IM6o_HFQAoaAaTQc7fg_NYbLJzd7";
const GRUPOS={
"Villano":["Doctor Doom"],
"Vengadores y aliados":["Thor","Loki","Capitán América (Sam Wilson)","Steve Rogers","Peggy Carter","Falcon (Joaquin Torres)","Bucky Barnes","Ant-Man (Scott Lang)","Cassie Lang","Sentry","Shang-Chi","Hulk (Bruce Banner)","Scarlet Witch"],
"Wakanda y Talokan":["Shuri (Black Panther)","M’Baku","Namor","Namora"],
"Thunderbolts":["Yelena Belova","Red Guardian","US Agent (John Walker)","Ghost"],
"Cuatro Fantásticos":["Reed Richards","Sue Storm","Johnny Storm","Ben Grimm (La Cosa)"],
"X-Men":["Profesor X","Magneto","Cíclope","Bestia","Nightcrawler","Mystique","Gambit"],
"No confirmados · Spider-Men y mutantes":["Spider-Man (Tom Holland)","Spider-Man (Tobey Maguire)","Spider-Man (Andrew Garfield)","Wolverine","Deadpool","Jean Grey"],
"No confirmados · Magia y multiverso":["Doctor Strange","Wong","Vision","Agatha Harkness","Mobius","Kang el Conquistador"],
"No confirmados · Héroes de los últimos años":["Capitana Marvel","Monica Rambeau","Ms. Marvel (Kamala Khan)","Nick Fury","Hawkeye (Clint Barton)","Kate Bishop","She-Hulk","Ironheart (Riri Williams)","Okoye","Red Hulk (Thaddeus Ross)","Wasp (Hope van Dyne)","Valkyrie","Valentina Allegra de Fontaine"],
"No confirmados · Cósmicos":["Star-Lord","Rocket","Groot","Nebula","Galactus","Silver Surfer"],
"No confirmados · Calle":["Daredevil","Kingpin","Punisher","Moon Knight"]};
const ALL=Object.values(GRUPOS).flat();
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let uid,cfg={closed:false,dead:[],absent:[],a:5,b:2,c:1,d:1},mine=new Set(),myName="",K=null,draft=null,timer,people=[],cur=null,busy=false,dirty=false;
function fail(m){const e=$("#err");e.textContent=m;e.classList.remove("hide")}
function tab(t){["bet","rank","adm"].forEach(x=>$("#"+x).classList.toggle("hide",x!==t));document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));if(t==="rank")rank()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.t));
function bet(){
  $("#closed").classList.toggle("hide",!cfg.closed);
  let h="";
  for(const[g,a]of Object.entries(GRUPOS)){h+="<h2>"+esc(g)+"</h2>";for(const c of a){const s=mine.has(c);h+='<button class="chip'+(s?" sel":"")+'" data-c="'+esc(c)+'"'+(cfg.closed?" disabled":"")+"><span>"+esc(c)+"</span><small>"+(s?"Muere":"")+"</small></button>"}}
  $("#list").innerHTML=h;
  $("#count").textContent=mine.size+" marcados como muertos"+(myName.trim()?"":" · escribe tu nombre para guardar");
  document.querySelectorAll("#list .chip").forEach(b=>b.onclick=()=>{const c=b.dataset.c;mine.has(c)?mine.delete(c):mine.add(c);bet();save()});
}
function renderWho(){
  $("#who").classList.toggle("hide",!people.length);
  $("#whoSel").innerHTML=people.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+"</option>").join("")+'<option value="new">➕ Añadir otra persona</option>';
  $("#whoSel").value=cur||"new";
}
function pick(id){
  const p=people.find(x=>x.id===id);
  cur=p?p.id:null;myName=p?p.name:"";mine=new Set(p?p.picks:[]);
  $("#name").value=myName;renderWho();bet();
  try{localStorage.setItem("porra_cur",cur||"")}catch(e){}
}
async function loadMine(selName){
  const{data,error}=await sb.from("picks").select("*").eq("user_id",uid).order("updated_at");
  if(error)return fail(error.message);
  people=data||[];
  let p=selName&&people.find(x=>x.name.toLowerCase()===selName.toLowerCase());
  if(!p){let last="";try{last=localStorage.getItem("porra_cur")||""}catch(e){}p=people.find(x=>x.id===last)||people[0]}
  pick(p?p.id:null);
}
function save(){dirty=true;clearTimeout(timer);timer=setTimeout(doSave,500)}
async function doSave(){
  if(busy){timer=setTimeout(doSave,300);return}
  if(!dirty||!myName.trim()||cfg.closed)return;
  busy=true;dirty=false;
  try{
    const row={name:myName.trim(),picks:[...mine],updated_at:new Date().toISOString()};
    const r=cur?await sb.from("picks").update(row).eq("id",cur).select().single()
               :await sb.from("picks").insert({...row,user_id:uid}).select().single();
    if(r.error){
      dirty=true;
      if(r.error.code==="23505"){fail("Ese nombre ya existe. Si eres tú, elígelo en «Ya aposté antes».");$("#claimSel").classList.remove("hide");loadPartis()}
      else fail("No se pudo guardar: "+r.error.message);
      return;
    }
    const d=r.data,i=people.findIndex(x=>x.id===d.id);
    if(i<0)people.push(d);else people[i]=d;
    cur=d.id;renderWho();
    $("#err").classList.add("hide");
    $("#count").textContent=mine.size+" marcados como muertos · ✓ guardado";
  }finally{busy=false}
}
async function flush(){clearTimeout(timer);while(busy)await new Promise(r=>setTimeout(r,100));await doSave()}
async function loadPartis(){
  const{data}=await sb.rpc("participantes");
  const mios=new Set(people.map(p=>p.name.toLowerCase())),n=(data||[]).map(p=>p.name).filter(x=>!mios.has(x.toLowerCase()));
  $("#claimList").innerHTML='<option value="">— Elige tu nombre —</option>'+n.map(x=>'<option value="'+esc(x)+'">'+esc(x)+"</option>").join("");
  $("#claimBox").classList.toggle("hide",cfg.closed||!n.length);
}
async function claim(name){
  if(!name)return;
  if(!confirm("¿Eres "+name+"? Pasarás a editar su apuesta desde este navegador.")){$("#claimList").value="";return}
  clearTimeout(timer);dirty=false;
  const{error}=await sb.rpc("reclamar",{p_name:name});
  if(error)return fail("No se pudo recuperar: "+error.message);
  await loadMine(name);
  $("#err").classList.add("hide");$("#claimSel").classList.add("hide");loadPartis();
}
$("#claimLink").onclick=()=>{$("#claimSel").classList.toggle("hide");loadPartis()};
$("#claimList").onchange=e=>claim(e.target.value);
$("#whoSel").onchange=async e=>{
  const v=e.target.value;await flush();
  if(v==="new"){cur=null;myName="";mine=new Set();$("#name").value="";renderWho();bet();$("#name").focus()}
  else pick(v);
};
function score(p){const A=new Set(cfg.absent),D=new Set(cfg.dead.filter(x=>!A.has(x))),pk=p.picks.filter(x=>!A.has(x)),h=pk.filter(x=>D.has(x)).length,f=pk.length-h,n=ALL.filter(x=>!A.has(x)).length;return{h,f,pts:h*cfg.a-f*cfg.b-(D.size-h)*cfg.c+(n-D.size-f)*cfg.d}}
async function rank(){
  await loadCfg();
  if(!cfg.closed){const{data}=await sb.rpc("participantes");$("#rank").innerHTML='<div class="msg">Apuestas abiertas. Los resultados se verán al cerrarlas.</div>'+(data||[]).map(p=>'<div class="card row"><b>'+esc(p.name)+"</b><span>"+p.n+" apuestas</span></div>").join("");return}
  const{data,error}=await sb.from("picks").select("name,picks");if(error)return fail(error.message);
  const has=cfg.dead.length>0,L=(data||[]).map(p=>Object.assign({},p,score(p)));
  L.sort((x,y)=>has?(y.pts-x.pts||y.h-x.h):x.name.localeCompare(y.name));
  let h=has?"":'<div class="msg">Aún no hay resultados.</div>';
  L.forEach((p,i)=>{h+='<div class="card"><div class="row"><span style="flex:1"><b>'+(has?(i+1)+". ":"")+esc(p.name)+"</b><br><small style='color:var(--mu)'>"+(has?p.h+" aciertos · "+p.f+" fallos":p.picks.length+" apuestas")+"</small></span>"+(has?'<span class="pts">'+p.pts+"</span>":"")+"</div><details><summary style='color:var(--mu);font-size:13px'>Ver apuesta</summary><div style='font-size:14px'>"+(p.picks.map(x=>(cfg.absent.includes(x)?"— ":cfg.dead.includes(x)?"✓ ":"✗ ")+esc(x)).join("<br>")||"Nada")+"</div></details></div>"});
  $("#rank").innerHTML=h;
}
async function loadCfg(){const{data}=await sb.from("config").select("*").eq("id",1).single();if(data)cfg=data}
async function adm(){
  if(!draft)draft={closed:cfg.closed,dead:[...cfg.dead],absent:[...cfg.absent],a:cfg.a,b:cfg.b,c:cfg.c,d:cfg.d};
  const{data}=await sb.rpc("participantes");
  let h='<p class="sub">Toca un personaje: 1 vez = murió, 2 veces = no aparece.</p><label><input type="checkbox" id="cl"'+(draft.closed?" checked":"")+"> Cerrar apuestas</label>";
  h+="<h2>Puntos: acierto · apostar y no muere · muerte no apostada · no apostar y no muere</h2><div class='row'>"+["a","b","c","d"].map(k=>'<input type="number" data-k="'+k+'" value="'+draft[k]+'">').join("")+"</div>";
  for(const[g,a]of Object.entries(GRUPOS)){h+="<h2>"+esc(g)+"</h2>";for(const c of a){const s=draft.dead.includes(c)?1:draft.absent.includes(c)?2:0;h+='<button class="chip d'+s+'" data-c="'+esc(c)+'"><span>'+esc(c)+"</span><small>"+["","Murió","No aparece"][s]+"</small></button>"}}
  h+='<button class="s" id="sv" style="width:100%;margin:14px 0">Guardar cambios</button><h2>Participantes</h2>'+(data||[]).map(p=>'<div class="card row"><span>'+esc(p.name)+'</span><button class="s" data-x="'+esc(p.name)+'">Borrar</button></div>').join("");
  $("#adm").innerHTML=h;
  $("#cl").onchange=e=>draft.closed=e.target.checked;
  document.querySelectorAll("[data-k]").forEach(i=>i.onchange=()=>draft[i.dataset.k]=+i.value);
  document.querySelectorAll("#adm .chip").forEach(b=>b.onclick=()=>{const c=b.dataset.c,s=draft.dead.includes(c)?1:draft.absent.includes(c)?2:0;draft.dead=draft.dead.filter(x=>x!==c);draft.absent=draft.absent.filter(x=>x!==c);if(s===0)draft.dead.push(c);if(s===1)draft.absent.push(c);adm()});
  $("#sv").onclick=async()=>{const{error}=await sb.rpc("admin_config",{k:K,p_closed:draft.closed,p_dead:draft.dead,p_absent:draft.absent,p_a:draft.a,p_b:draft.b,p_c:draft.c,p_d:draft.d});if(error)return alert(error.message);await loadCfg();alert("Guardado")};
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{if(!confirm("¿Borrar a "+b.dataset.x+"?"))return;const{error}=await sb.rpc("admin_borrar",{k:K,p_name:b.dataset.x});if(error)return alert(error.message);adm()});
}
$("#admBtn").onclick=()=>{K=K||prompt("Clave de admin");if(K){tab("adm");adm()}};
$("#name").oninput=e=>{myName=e.target.value;bet();save()};
(async()=>{
  try{
    let{data:{session}}=await sb.auth.getSession();
    if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}
    uid=session.user.id;await loadCfg();
    await loadMine();bet();loadPartis();
  }catch(e){fail("No se pudo conectar: "+(e.message||e))}
})();
</script>
</body>
</html>
