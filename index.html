<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Porra Doomsday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<meta name="theme-color" content="#070b14">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Paleta: azul noche, rojo Vengadores, dorado para puntos y primer puesto */
:root{--bg:#070b14;--cd:#111a2b;--cd2:#18233a;--tx:#eaf0f8;--mu:#8a9bb5;--ok:#f0b429;--ko:#ff4d57;--bd:#26344d;--red:#d6202c;--gold:#f0b429;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.4 "Barlow",system-ui,sans-serif;background:radial-gradient(900px 420px at 50% -120px,rgba(214,32,44,.30),transparent 70%) no-repeat,var(--bg)}
main{max-width:560px;margin:auto;padding:16px 14px 90px}
h1,.pts{font-family:"Russo One",Impact,sans-serif;font-weight:400}
.gh,.big{font-family:"Rajdhani","Barlow Condensed",Impact,sans-serif;font-weight:700}
h1{position:absolute;left:0;right:0;bottom:12px;z-index:2;margin:0;text-align:center;font-size:clamp(24px,8.4vw,46px);line-height:1.05;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;filter:drop-shadow(0 2px 8px rgba(0,0,0,.85))}
h1 span{background:linear-gradient(180deg,#fff 0%,#d5deea 40%,#8796ad 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
h1::after{content:"";display:block;width:64px;height:4px;margin:8px auto 0;background:var(--red)}
.art{position:relative;aspect-ratio:400/300;width:100%;max-width:440px;margin:6px auto 10px;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--cd)}
.art::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(transparent 55%,rgba(7,11,20,.85))}
.artsvg,#heroImg{position:absolute;inset:0;width:100%;height:100%}
#heroImg{object-fit:cover}
.sub{color:var(--mu);margin:0 0 14px;font-size:15px;text-align:center}
.tabs-row{display:flex;align-items:center;gap:6px;margin:10px 0 14px}.tabs-row .tabs{flex:1;margin:0}
.tabs{display:flex;gap:6px;margin:10px 0 14px}
.tabs button,.s{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:4px;font:inherit;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.help-btn{flex:none!important;width:44px;height:44px;padding:0!important;border-radius:50%!important;font-family:"Russo One",Impact,sans-serif;font-size:19px;color:var(--gold)!important;border-color:var(--gold)!important}
.help-backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(7,11,20,.82);backdrop-filter:blur(4px)}
.help-backdrop.hide{display:none}.help-modal{width:min(480px,100%);max-height:82vh;overflow:auto;background:var(--cd);border:1px solid var(--gold);border-radius:8px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.help-modal h2{margin:0 0 12px;color:var(--tx);font-family:"Rajdhani",sans-serif;font-size:22px}.help-modal .close-row{display:flex;justify-content:flex-end;margin-top:14px}.help-list{display:grid;gap:8px}.help-rule{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:6px;background:var(--cd2)}.help-rule b{color:var(--gold);font-family:"Russo One",sans-serif;font-size:18px}.help-rule span{color:var(--tx);font-size:14px}
input[type=text],input[type=number],select{width:100%;padding:12px;font:inherit;border:1px solid var(--bd);border-radius:4px;background:var(--cd2);color:var(--tx)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2{font-size:14px;color:var(--mu);margin:20px 0 6px;font-weight:600}
/* Equipos desplegables */
.grp{margin:0 0 8px;border:1px solid var(--bd);border-radius:6px;background:var(--cd);overflow:hidden}
.gh{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border:0;background:transparent;color:var(--tx);font-size:24px;font-weight:700;letter-spacing:.02em;text-align:left;cursor:pointer}
.gt{flex:1}
.gt .nc{font:500 12px "Barlow",sans-serif;font-style:normal;letter-spacing:0;color:var(--mu);margin-left:8px;border:1px solid var(--bd);border-radius:10px;padding:1px 8px;vertical-align:middle}
.gn{font-size:17px;color:var(--mu)}
.gn.on{color:var(--gold)}
.ch{flex:none;color:var(--mu);transition:transform .25s}
.gh[aria-expanded=true] .ch{transform:rotate(180deg)}
.gh[aria-expanded=true]{border-bottom:1px solid var(--bd)}
.pn{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.pn.open{grid-template-rows:1fr}
.pn>div{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .25s}
.pn.open>div{visibility:visible;transition-delay:0s}
.pi{padding:8px 8px 3px}
.chip{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 14px;margin:0 0 5px;border:1px solid var(--bd);background:var(--cd2);color:var(--tx);border-radius:4px;font:inherit;text-align:left;cursor:pointer}
.chip:disabled{opacity:.6;cursor:default}
.chip.sel,.chip.d1{border-color:var(--ko);background:linear-gradient(90deg,rgba(214,32,44,.30),var(--cd2) 75%);box-shadow:inset 4px 0 0 var(--ko)}
.chip.sel small,.chip.d1 small{color:var(--ko);font-weight:600}
.chip.d2{opacity:.45;text-decoration:line-through}
.chip small{color:var(--mu);font-size:20px;line-height:1}
.bar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;font-size:14px;color:var(--mu);border-top:1px solid var(--bd)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:12px 14px;margin:0 0 8px}
.card.top{border-color:var(--gold);box-shadow:inset 4px 0 0 var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pts{font-size:30px;color:var(--gold)}
#who{color:var(--gold)}
.msg{padding:12px;border-left:4px solid var(--gold);background:var(--cd);margin:10px 0;font-size:14px;border-radius:0 4px 4px 0}
.hide{display:none}
.s{flex:none;padding:8px 12px}
/* Botones de inicio con esquinas cortadas */
.big{display:block;width:100%;padding:18px 20px;margin:0 0 10px;border:0;color:var(--tx);font-size:23px;letter-spacing:.02em;text-align:left;cursor:pointer;background:linear-gradient(135deg,var(--cd2),var(--cd));box-shadow:inset 4px 0 0 var(--red);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.big.go{background:var(--red);box-shadow:none;text-align:center}
#newBox,#oldBox{margin:0 0 14px}
#newBox input{margin-bottom:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header class="hero">
  <!-- contenido existente del encabezado y SVG conservado -->
  <div class="art">
    <svg class="artsvg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Doctor Doom rodeado de los héroes"><rect width="400" height="300" fill="#0b1220"/><circle cx="200" cy="145" r="82" fill="#d6202c" opacity=".25"/><circle cx="200" cy="170" r="52" fill="#1f5a3a"/><rect x="173" y="105" width="54" height="82" rx="18" fill="#b6c1cc"/><path d="M180 125Q200 116 220 125M200 150V168M188 174H212" fill="none" stroke="#7d8a97" stroke-width="3"/></svg>
    <img id="heroImg" src="vengadores.jpg" alt="" onerror="this.remove()">
    <h1><span>Porra Doomsday</span></h1>
  </div>
  <p class="sub">Marca quién crees que muere en Avengers: Doomsday.</p>
</header>
<div id="err" class="msg hide" style="border-color:var(--ko)"></div>
<div class="tabs-row">
  <div class="tabs"><button data-t="bet" class="on">Mi apuesta</button><button data-t="rank">Ranking</button></div>
  <button class="s help-btn" id="helpBtn" aria-label="Cómo funcionan las puntuaciones" title="Cómo funcionan las puntuaciones">?</button>
</div>
<section id="bet">
  <div id="home">
    <div id="closed" class="msg hide">Apuestas cerradas. Mira el Ranking para ver los resultados.</div>
    <div id="homeBtns">
      <button class="big" id="btnNew">Añadir participante</button>
      <div id="newBox" class="hide"><input type="text" id="name" placeholder="Tu nombre" maxlength="24" autocomplete="off"><button class="big go" id="btnGo">Empezar a votar</button></div>
      <button class="big" id="btnOld">Ya participo: editar mi voto</button>
      <div id="oldBox" class="hide"><select id="claimList"></select></div>
    </div>
  </div>
  <div id="vote" class="hide"><div class="card row"><span>Votando como <b id="who"></b></span><button class="s" id="btnSwitch">Cambiar</button></div><div id="list"></div><div class="bar" id="count"></div></div>
</section>
<section id="rank" class="hide"></section>
<section id="adm" class="hide"></section>
<p style="text-align:center;margin-top:30px"><button class="s" id="admBtn">Admin</button></p>
</main>
<div id="helpModal" class="help-backdrop hide" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="help-modal">
    <h2 id="helpTitle">¿Cómo se puntúa?</h2>
    <div id="helpRules" class="help-list"></div>
    <div class="close-row"><button class="s" id="helpClose">Cerrar</button></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://zmpmqllonbvxoervdyxd.supabase.co", SUPABASE_KEY="sb_publishable_Oq1IM6o_HFQAoaAaTQc7fg_NYbLJzd7";
const GRUPOS={
"Villano":["Doctor Doom"],
"Vengadores y aliados":["Thor","Loki","Capitán América (Sam Wilson)","Steve Rogers","Peggy Carter","Falcon (Joaquin Torres)","Bucky Barnes","Ant-Man (Scott Lang)","Cassie Lang","Sentry","Shang-Chi","Hulk (Bruce Banner)","Scarlet Witch"],
"Wakanda y Talokan":["Shuri (Black Panther)","M’Baku","Namor","Namora"],"Thunderbolts":["Yelena Belova","Red Guardian","US Agent (John Walker)","Ghost"],"Cuatro Fantásticos":["Reed Richards","Sue Storm","Johnny Storm","Ben Grimm (La Cosa)"],"X-Men":["Profesor X","Magneto","Cíclope","Bestia","Nightcrawler","Mystique","Gambit"],"No confirmados · Spider-Men y mutantes":["Spider-Man (Tom Holland)","Spider-Man (Tobey Maguire)","Spider-Man (Andrew Garfield)","Wolverine","Deadpool","Jean Grey"],"No confirmados · Magia y multiverso":["Doctor Strange","Wong","Vision","Agatha Harkness","Mobius","Kang el Conquistador"],"No confirmados · Héroes de los últimos años":["Capitana Marvel","Monica Rambeau","Ms. Marvel (Kamala Khan)","Nick Fury","Hawkeye (Clint Barton)","Kate Bishop","She-Hulk","Ironheart (Riri Williams)","Okoye","Red Hulk (Thaddeus Ross)","Wasp (Hope van Dyne)","Valkyrie","Valentina Allegra de Fontaine"],"No confirmados · Cósmicos":["Star-Lord","Rocket","Groot","Nebula","Galactus","Silver Surfer"],"No confirmados · Calle":["Daredevil","Kingpin","Punisher","Moon Knight"]};
const ALL=Object.values(GRUPOS).flat();
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let uid,cfg={closed:false,dead:[],absent:[],a:5,b:2,c:1,d:1},mine=new Set(),myName="",K=null,draft=null,timer,people=[],cur=null,busy=false,dirty=false;
function fail(m){const e=$("#err");e.textContent=m;e.classList.remove("hide")}
function openHelp(){const rules=[[`+${cfg.a||0}`,"Acertaste: apostaste que moriría y murió."],[`-${cfg.b||0}`,"Apostaste que moriría, pero sobrevivió."],[`-${cfg.c||0}`,"Murió, pero no lo habías marcado."],[`+${cfg.d||0}`,"No apostaste por él y no murió."]];$("#helpRules").innerHTML=rules.map(([pts,text])=>`<div class="help-rule"><b>${pts}</b><span>${text}</span></div>`).join("");$("#helpModal").classList.remove("hide")}
$("#helpBtn").onclick=openHelp;$("#helpClose").onclick=()=>$("#helpModal").classList.add("hide");$("#helpModal").onclick=e=>{if(e.target===e.currentTarget)$("#helpModal").classList.add("hide")};document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#helpModal").classList.add("hide")});
function tab(t){["bet","rank","adm"].forEach(x=>$("#"+x).classList.toggle("hide",x!==t));document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));if(t==="rank")rank()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.t));
function show(v){$("#home").classList.toggle("hide",v!=="home");$("#vote").classList.toggle("hide",v!=="vote")}
const OP={bet:new Set(),adm:new Set()};
const lbl=g=>g.replace("No confirmados · ","");
function grp(g,items,set,chipFn,n){const o=set.has(g),nc=g.startsWith("No confirmados")?'<em class="nc">No confirmado</em>':"";return '<div class="grp"><button class="gh" data-g="'+esc(g)+'" aria-expanded="'+o+'"><span class="gt">'+esc(lbl(g))+nc+'</span><span class="gn'+(n?" on":"")+'">'+n+'/'+items.length+'</span><svg class="ch" viewBox="0 0 12 12" width="16" height="16" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button><div class="pn'+(o?" open":"")+'"><div><div class="pi">'+items.map(chipFn).join("")+'</div></div></div></div>'}
function acc(root,set){root.querySelectorAll(".gh").forEach(b=>b.onclick=()=>{const g=b.dataset.g,o=!set.has(g);o?set.add(g):set.delete(g);b.nextElementSibling.classList.toggle("open",o);b.setAttribute("aria-expanded",o)})}
function bet(){const chip=c=>{const s=mine.has(c);return '<button class="chip'+(s?" sel":"")+'" data-c="'+esc(c)+'"'+(cfg.closed?" disabled":"")+'><span>'+esc(c)+'</span><small>'+((s)?"💀":"")+'</small></button>'};$("#list").innerHTML=Object.entries(GRUPOS).map(([g,a])=>grp(g,a,OP.bet,chip,a.filter(c=>mine.has(c)).length)).join("");acc($("#list"),OP.bet);$("#count").textContent=mine.size+" marcados como muertos"+(cfg.closed?" · apuestas cerradas":"");document.querySelectorAll("#list .chip").forEach(b=>b.onclick=()=>{const c=b.dataset.c;mine.has(c)?mine.delete(c):mine.add(c);bet();save()})}
async function loadMine(){const{data,error}=await sb.from("picks").select("*").eq("user_id",uid).order("updated_at");if(error)return fail(error.message);people=data||[]}
function save(){dirty=true;clearTimeout(timer);timer=setTimeout(doSave,500)}
async function doSave(){if(busy){timer=setTimeout(doSave,300);return}if(!dirty||!cur||cfg.closed)return;busy=true;dirty=false;try{const{data,error}=await sb.from("picks").update({picks:[...mine],updated_at:new Date().toISOString()}).eq("id",cur).select().single();if(error){dirty=true;await loadCfg();if(cfg.closed)bet();return fail(cfg.closed?"Las apuestas se acaban de cerrar: tu último cambio no se guardó.":"No se pudo guardar: "+error.message)}const i=people.findIndex(x=>x.id===data.id);if(i>=0)people[i]=data;$("#err").classList.add("hide");$("#count").textContent=mine.size+" marcados como muertos · ✓ guardado"}finally{busy=false}}
async function flush(){clearTimeout(timer);while(busy)await new Promise(r=>setTimeout(r,100));await doSave()}
async function goHome(){await flush();if(dirty&&!confirm("No se pudo guardar tu último cambio. ¿Salir igualmente?"))return;dirty=false;cur=null;myName="";mine=new Set();$("#err").classList.add("hide");await loadCfg();await loadMine();$("#name").value="";$("#newBox").classList.add("hide");$("#oldBox").classList.add("hide");$("#closed").classList.toggle("hide",!cfg.closed);$("#homeBtns").classList.toggle("hide",cfg.closed);show("home")}
function enter(p){cur=p.id;myName=p.name;mine=new Set(p.picks);$("#who").textContent=myName;$("#err").classList.add("hide");show("vote");bet();window.scrollTo(0,0)}
$("#btnNew").onclick=()=>{$("#oldBox").classList.add("hide");$("#newBox").classList.toggle("hide");$("#name").focus()};
async function create(){const n=$("#name").value.trim();if(!n)return fail("Escribe tu nombre para empezar.");if(cfg.closed)return fail("Las apuestas están cerradas.");const{data,error}=await sb.from("picks").insert({user_id:uid,name:n,picks:[]}).select().single();if(error)return fail(error.code===23505?"Ese nombre ya existe. Si eres tú, pulsa «Ya participo» y elígelo en la lista.":"No se pudo crear: "+error.message);people.push(data);enter(data)}
$("#btnGo").onclick=create;$("#name").onkeydown=e=>{if(e.key==="Enter")create()};
$("#btnOld").onclick=async()=>{$("#newBox").classList.add("hide");$("#oldBox").classList.toggle("hide");const{data,error}=await sb.rpc("participantes");if(error)return fail(error.message);const n=(data||[]).map(p=>p.name);$("#claimList").innerHTML=(n.length?' <option value="">— Elige tu nombre —</option>':'<option value="">Aún no hay participantes</option>')+n.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join("")};
$("#claimList").onchange=async e=>{const name=e.target.value;if(!name)return;let p=people.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!p){if(!confirm("¿Eres "+name+"? Pasarás a editar su voto desde este navegador."))return void(e.target.value="");const{error}=await sb.rpc("reclamar",{p_name:name});if(error)return fail("No se pudo recuperar: "+error.message);await loadMine();p=people.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!p)return fail("No se encontró esa apuesta.")}enter(p)};
$("#btnSwitch").onclick=goHome;
function score(p){const A=new Set(cfg.absent),D=new Set(cfg.dead.filter(x=>!A.has(x))),pk=p.picks.filter(x=>!A.has(x)),h=pk.filter(x=>D.has(x)).length,f=pk.length-h,n=ALL.filter(x=>!A.has(x)).length;return{h,f,pts:h*cfg.a-f*cfg.b-(D.size-h)*cfg.c+(n-D.size-f)*cfg.d}}
async function rank(){await loadCfg();if(!cfg.closed){const{data}=await sb.rpc("participantes");$("#rank").innerHTML='<div class="msg">Apuestas abiertas. Los resultados se verán al cerrarlas.</div>'+(data||[]).map(p=>'<div class="card row"><b>'+esc(p.name)+'</b><span>'+p.n+' apuestas</span></div>').join("");return}const{data,error}=await sb.from("picks").select("name,picks");if(error)return fail(error.message);const has=cfg.dead.length>0,L=(data||[]).map(p=>Object.assign({},p,score(p)));L.sort((x,y)=>has?(y.pts-x.pts||y.h-x.h):x.name.localeCompare(y.name));let h=has?"":"<div class='msg'>Aún no hay resultados.</div>";L.forEach((p,i)=>{h+='<div class="card'+(has&&i===0?" top":"")+'"><div class="row"><span style="flex:1"><b>'+esc(p.name)+'</b><br><small style="color:var(--mu)">'+(has?p.h+' aciertos · '+p.f+' fallos':p.picks.length+' apuestas')+'</small></span>'+ (has?' <span class="pts">'+p.pts+'</span>':"")+'</div></div>'});$("#rank").innerHTML=h}
async function loadCfg(){const{data}=await sb.from("config").select("*").eq("id",1).single();if(data)cfg=data}
let parts=null;
async function adm(refresh){if(!draft)draft={closed:cfg.closed,dead:[...cfg.dead],absent:[...cfg.absent],a:cfg.a,b:cfg.b,c:cfg.c,d:cfg.d};if(!parts||refresh)parts=(await sb.rpc("participantes")).data||[];let h='<p class="sub">Toca un personaje: 1 vez = 💀 murió, 2 veces = 🚫 no aparece.</p><label><input type="checkbox" id="cl"'+(draft.closed?" checked":"")+'> Cerrar apuestas</label>';h+="<h2>Puntos: acierto · apostar y no muere · muerte no apostada · no apostar y no muere</h2><div class='row'>"+["a","b","c","d"].map(k=>'<input type="number" data-k="'+k+'" value="'+draft[k]+'">').join("")+'</div>';h+=Object.entries(GRUPOS).map(([g,a])=>grp(g,a,OP.adm,c=>{const s=draft.dead.includes(c)?1:draft.absent.includes(c)?2:0;return '<button class="chip d'+s+'" data-c="'+esc(c)+'"><span>'+esc(c)+'</span><small>'+["",'💀','🚫'][s]+'</small></button>'},a.filter(c=>draft.dead.includes(c)||draft.absent.includes(c)).length)).join("");h+='<button class="s" id="sv" style="width:100%;margin:14px 0">Guardar cambios</button><h2>Participantes</h2>'+parts.map(p=>'<div class="card row"><span>'+esc(p.name)+'</span><button class="s" data-x="'+esc(p.name)+'">Borrar</button></div>').join("");$("#adm").innerHTML=h;acc($("#adm"),OP.adm);$("#cl").onchange=e=>draft.closed=e.target.checked;document.querySelectorAll("[data-k]").forEach(i=>i.onchange=()=>draft[i.dataset.k]=+i.value);document.querySelectorAll("#adm .chip").forEach(b=>b.onclick=()=>{const c=b.dataset.c,s=draft.dead.includes(c)?1:draft.absent.includes(c)?2:0;draft.dead=draft.dead.filter(x=>x!==c);draft.absent=draft.absent.filter(x=>x!==c);if(s===0)draft.dead.push(c);if(s===1)draft.absent.push(c);adm()});$("#sv").onclick=async()=>{const{error}=await sb.rpc("admin_config",{k:K,p_closed:draft.closed,p_dead:draft.dead,p_absent:draft.absent,p_a:draft.a,p_b:draft.b,p_c:draft.c,p_d:draft.d});if(error)return alert(error.message);await loadCfg();draft=null;alert("Guardado")};document.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{if(!confirm("¿Borrar a "+b.dataset.x+"?"))return;const{error}=await sb.rpc("admin_borrar",{k:K,p_name:b.dataset.x});if(error)return alert(error.message);adm(true)})}
$("#admBtn").onclick=async()=>{if(K){tab("adm");adm(true);return}const k=prompt("Clave de admin");if(!k)return;const{data,error}=await sb.rpc("admin_check",{k});if(error)return alert("No se pudo comprobar la clave: "+error.message);if(data!==true)return alert("Clave incorrecta");K=k;tab("adm");adm(true)};
(async()=>{try{let{data:{session}}=await sb.auth.getSession();if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}uid=session.user.id;await loadCfg();await goHome()}catch(e){fail("No se pudo conectar: "+(e.message||e))}})();
function fit(){const h=$(".art h1"),t=h.firstElementChild;h.style.fontSize="";let fs=parseFloat(getComputedStyle(h).fontSize);while(t.offsetWidth>h.clientWidth-24&&fs>16){fs--;h.style.fontSize=fs+"px"}}fit();window.addEventListener("resize",fit);if(document.fonts)document.fonts.ready.then(fit);
</script>
